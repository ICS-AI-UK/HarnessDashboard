[build]
  # The front-end is plain static files; there is nothing to compile, but the
  # function's dependencies still need installing, so no `command` is set here
  # rather than an empty one (an empty command can skip the build step).
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # data.json ships with the function so a brand new site starts with this data.
  included_files = ["data.json", "lib/**"]

# No redirect for /api/data: data.js declares `path = "/api/data"` itself, and
# doing so REPLACES the default /.netlify/functions/data endpoint rather than
# adding to it. A redirect pointing there would 404 in production.
